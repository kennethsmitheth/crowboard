[platformio]
default_envs = crowpanel7

; CrowPanel ESP32 7.0" HMI (Elecrow) — ESP32-S3-WROOM-1-N4R8
;   4 MB quad flash, 8 MB octal PSRAM, 800x480 RGB TFT, GT911 touch, CH340 USB-UART
[env:crowpanel7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; N4R8: quad flash + octal PSRAM. The RGB frame buffer (800*480*2 bytes) lives in PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    ; Serial fault-injection commands (nvs corrupt, crash); see docs/robustness-checklist.md.
    -DCROWBOARD_DEBUG_CMDS

lib_deps =
    lovyan03/LovyanGFX@1.2.36

upload_speed = 460800
; upload_port is auto-detected; set it (or pass --upload-port) if PlatformIO picks the wrong device
monitor_speed = 921600
monitor_filters = esp32_exception_decoder

; Host-side unit tests: `pio test -e native`.
; RULE: src/game and src/services must never include Arduino or ESP-IDF headers
; (no Arduino.h, esp_*.h, freertos/*). Hardware access goes through injected interfaces.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=c++17 -DNATIVE_TEST
build_src_filter =
    -<*>
    +<game/>
    +<services/>
